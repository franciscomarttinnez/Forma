[build]
  command = "npm run build"
  # Required: must NOT be the site root (Netlify defaults to repo root and breaks Next.js Runtime)
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NODE_OPTIONS = "--max-old-space-size=4096"

# @netlify/plugin-nextjs is enabled from the Netlify UI / auto for Next.js sites.
